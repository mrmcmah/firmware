[env:wildfire-wearable]
extends = esp32s3_base
; ESP32-S3-WROOM-1-N4: 4 MB quad-SPI flash, no PSRAM
board = ESP32-S3-WROOM-1-N4
board_level = extra
upload_protocol = esptool
upload_speed = 921600
; Console on USB CDC, the board's only USB port. UART0 is on the J8 debug header.
build_unflags =
  ${esp32s3_base.build_unflags}
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  ${esp32s3_base.build_flags}
  -D WILDFIRE_WEARABLE
  -I variants/esp32s3/wildfire_wearable
  -DARDUINO_USB_CDC_ON_BOOT=1
